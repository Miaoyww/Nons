[package]
name = "ncmdump"
version = "0.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/iqiziqi/ncmdump.rs"
[dependencies]
aes = "0.8"
base64 = "0.21"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
[features]
default = ["ncmdump"]
ncmdump = []
